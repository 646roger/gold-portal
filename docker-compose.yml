# Local PostgreSQL only. Then: npm run db:migrate && npm run db:seed
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: goldloan
      POSTGRES_PASSWORD: goldloan
      POSTGRES_DB: goldloan
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goldloan"]
      interval: 3s
      retries: 10
volumes:
  pgdata:
